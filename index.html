<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hoy — Agenda</title>
  <meta name="description" content="Resumen del día: horario, tareas y últimas notas.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12141c">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">

  <!-- Tipografía -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/hoy.css">
</head>
<body>
  <div class="app-shell">

    <nav class="tabbar" aria-label="Navegación principal">
      <span class="tabbar__brand">agenda</span>
      <div class="tabbar__tabs" role="tablist">
        <a href="index.html" class="tab" aria-current="page" role="tab">hoy.html</a>
        <a href="pages/agenda.html" class="tab" role="tab">agenda.html</a>
        <a href="pages/notas.html" class="tab" role="tab">
          notas.html <span class="dot-unsaved" title="Nota sin terminar"></span>
        </a>
        <a href="pages/ajustes.html" class="tab" role="tab">ajustes.html</a>
      </div>
    </nav>

    <!-- Widget "próxima alarma": visible siempre, sin abrir el calendario -->
    <div class="next-alarm-strip" id="next-alarm-strip" hidden>
      <span class="next-alarm-strip__dot" aria-hidden="true"></span>
      <span>próxima alarma → <strong id="proxima-alarma-texto"></strong></span>
    </div>

    <main class="app-main">
      <div class="container">

        <header class="page-header">
          <div>
            <span class="page-header__eyebrow" id="fecha-hoy">Martes 22 de julio</span>
            <h1>Hoy</h1>
          </div>
          <button class="btn btn--primary" type="button" id="btn-nueva-actividad">+ Actividad</button>
        </header>

        <section class="section-block" aria-labelledby="titulo-horario">
          <h2 id="titulo-horario" class="section-block__title">
            Horario de hoy
            <span class="streak-badge" id="racha-badge" hidden></span>
          </h2>

          <div id="lista-horario-hoy">
            <!-- Generado por JS: eventos de hoy + checklist "hecho hoy" (js/components/checklistHoy.js) -->
          </div>
        </section>

        <section class="section-block" aria-labelledby="titulo-notas">
          <h2 id="titulo-notas" class="section-block__title">Últimas notas</h2>

          <div id="lista-ultimas-notas">
            <!-- Generado por JS: últimas notas reales (js/components/notasHoy.js) -->
          </div>
        </section>

      </div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/components/checklistHoy.js"></script>
  <script type="module" src="js/components/notasHoy.js"></script>
  <script type="module" src="js/components/proximaAlarma.js"></script>
  <script type="module" src="js/components/alarmaManager.js"></script>
</body>
</html>
