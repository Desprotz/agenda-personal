<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notas — Agenda</title>

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#12141c">
  <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/notas.css">
</head>
<body>
  <div class="app-shell">

    <nav class="tabbar" aria-label="Navegación principal">
      <span class="tabbar__brand">agenda</span>
      <div class="tabbar__tabs" role="tablist">
        <a href="../index.html" class="tab" role="tab">hoy.html</a>
        <a href="agenda.html" class="tab" role="tab">agenda.html</a>
        <a href="notas.html" class="tab" aria-current="page" role="tab">
          notas.html <span class="dot-unsaved" title="Nota sin terminar"></span>
        </a>
        <a href="ajustes.html" class="tab" role="tab">ajustes.html</a>
      </div>
    </nav>

    <main class="app-main">
      <div class="container">

        <header class="page-header">
          <div>
            <span class="page-header__eyebrow">Diario</span>
            <h1>Notas</h1>
          </div>
          <div style="display:flex; gap: var(--space-2);">
            <button class="btn btn--ghost btn--icon" type="button" title="Grabar nota de voz" aria-label="Grabar nota de voz">🎙</button>
            <button class="btn btn--primary" type="button" id="btn-nueva-nota">+ Nota</button>
          </div>
        </header>

        <div class="search-bar" role="search">
          <span class="search-bar__prompt">›</span>
          <input type="search" placeholder="Buscar en tus notas..." aria-label="Buscador de notas">
        </div>

        <div class="filter-bar" role="group" aria-label="Filtrar por etiqueta" id="filtro-etiquetas-notas">
          <!-- Generado por JS: un chip por etiqueta real (js/components/notas.js) -->
        </div>

        <div id="lista-notas">
          <!-- Generado por JS: notas reales (js/components/notas.js) -->
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/components/grabadorAudio.js"></script>
  <script type="module" src="../js/components/notas.js"></script>
  <script type="module" src="../js/components/alarmaManager.js"></script>
</body>
</html>
