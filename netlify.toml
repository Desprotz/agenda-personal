[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw/service-worker.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
